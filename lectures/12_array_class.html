<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>사원 정보 관리 시스템 (Object + Array)</h2>
    <div id = "employee-list"></div>
        <!-- <div>
            <h3>${emp.getInfo()}</h3>
            <p>급여 : $${emp.salary.toLocaleString()}</p>
            <p>특이사항 : ${emp.isManager ? "<b>팀장</b>" : "일반"}</p>     
        </div> -->
    <h2>배열 CRUD 테스트 (콘솔창을 확인하세요)</h2>
    <div id="display"></div>
    <script>
        function Employee(id, name, salary, dept){
            this.id = id;
            this.name = name;
            this.salary = salary;
            this.dept = dept;
            this.getInfo = function(){ // 함수 표현식
                return `[${this.dept}] ${this.name} (사번: ${this.id})`;
            };
        }
        let empolyees = [ // 참조배열 (주소가진 배열)
            new Employee(101, "김철수", 5000, "개발팀"),
            new Employee(102, "이영희", 5000, "디자인팀"),
            new Employee(103, "박지성", 5000, "영업팀")
        ];
        let newEmp = new Employee(104, "최강인", 9000, "전략팀");
        newEmp.isManager = true; // 없는 멤버변수 추가 : 사이즈가 다름 : 파이썬과 동일
        empolyees.push(newEmp);
        let listContainer = document.getElementById("employee-list");
        // 배열 : 함수형 프로그래밍 
        // 구조적 프로그래밍 -> 객체지향프로그래밍 -> 일반화 프로그래밍(javascript, python) -> 함수형 프로그래밍
        // C, JAVA : template가 일반화 (데이터타입을 컴파일 타임에 지정)
        empolyees.forEach(function(emp){ // forEach문 뒤에는 함수가 연결 
            // <div></div>
            let card = document.createElement("div"); // element(tag + data)
            card.className = "card";
            if (emp.salary >= 6000){
                card.classList.add("high-salary");
            }
            card.innerHTML = `
                <h3>${emp.getInfo()}</h3>
                <p>급여 : $${emp.salary.toLocaleString()}</p>
                <p>특이사항 : ${emp.isManager ? "<b>팀장</b>" : "일반"}</p> <!-- 삼항 연산자 -->
            `;
            listContainer.appendChild(card);
        });
        function createEmployee(newEmp){
            empolyees.push(newEmp);
            console.log("C : 데이터 추가 완료", newEmp);
        }
        function readEmployee(){
            console.log("R : 전체 목록 조회");
            console.table(empolyees);
            const display = document.getElementById("display");
            display.innerHTML = empolyees.map(e => `<li>${e.name} (${e.dept})</li>`).join("");
        }
        function updateSalary(id, newSalary){
            empolyees = empolyees.map(emp =>
                emp.id === id ? {...emp, salary : newSalary } : emp
            );
            console.log(`U : ${id}번 사원 급여 수정 완료`);
        }
        function deleteEmployee(id){
            empolyees = empolyees.filter(emp => emp.id !== id);
            console.log(`D : ${id}번 사원 삭제 완료`);
        }
        readEmployee();
        createEmployee({ id : 3, name : "박지성", dept : "영업", salary : 4500});
        readEmployee();

        updateSalary(102, 8000);
        readEmployee();

        deleteEmployee(101);
        readEmployee();
    </script>
</body>
</html>
