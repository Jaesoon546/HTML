<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        button {
            padding: 0.75rem 1.5rem;
            margin-top: 1rem;
            font-size: 1rem;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <form name = "calc">
        <!-- 자바스크립터는 int, float이 없음 => number 
         입출력 할때는 text로 입력 => parseInt, parseFloat로 변환 => 변환된 결과 => number(64bit) -->
        <input type="number" id="num1" class="btn btn-success" value="0">
        <input type="number" id="num2" class="btn btn-success" value="0">
        <br>
        <button type="button" class="btn btn-success" onclick="calcnum()">계산</button>
        <br><br>
        <span>=</span>
        <input type="text" id="calc_result" value="0">
    </form>
    <!-- calcnum 함수 작성 -->
    <script>
    function calcnum(){
        // const num1 = Number(document.getElementById("num1").value);
        // const num2 = Number(document.getElementById("num2").value);
        // document.getElementById("calc_result").value = num1 + num2;

        const num1Input = document.getElementById('num1');
        const num2Input = document.getElementById('num2');
        const resultInput = document.getElementById('calc_result');
        const num1 = parseFloat(num1Input.value) || 0; // 숫자가 아니거나 null이거나
        const rawNum1 = parseFloat(num1Input.value) ?? ''; // null 안정성
        const num2 = parseFloat(num2Input.value) || 0;
        const sum = num1 + num2;
        resultInput.value = sum;
    }
    </script>
</body>
</html>
