<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .bluetext{ /* class 이름 사용 : 임의로 정한 이름*/
            font-size: 50px;
            color: orange;
        }
        #usda{ /* id에 적용 : element에 있는 */
            font-size: 30px;
            color: green;
        }
        table, th, td{ /* tag 이름에 적용 */
            border: 1px solid #ccc; /* #으로 시작하고 3바이트로 표현하는 컬러값 2자리당 1바이트 */
        }
        td{
            padding: 5px; /* 셀 테두리와 내용 사이의 간격(패딩) */
        }
    </style>
</head>
<body>
    <h1> 블루베리에 관한 연구 </h1>
    <h2 class="bluetext"> 블루베리와 황산화 효능</h2>
    <p class="bluetext"> 블루베리는 황산화제</p>
    <h2> 블루베리와 노화</h2>
    <p id="usda">USDA 인류 영양 연구센터</p>

    <table border="1">
        <colgroup> <!-- 일별 작업 -->
            <col>
            <col span="1" style="background-color: skyblue;"> <!-- 인라인 css -->
            <col style="background-color: yellow;">
        </colgroup>
        <tr> <!-- table row 레코드행 -->
            <th> 제목 1열</th> <!-- header로 열이름, 개수일치-->
            <th> 제목 2열</th>
            <th> 제목 3열</th>
            <!--
            <th> 제목 1열</th> 
            <th colspan="2"> 제목 2열</th>
            -->
        </tr>
        <tr>
            <!-- <td rowspan="2"> 제목 1</td> -->
            <td> 제목 1</td>
            <td> 1행 2열</td>
            <td> 1행 3열</td>

        </tr>
        <tr>
            <td> 제목 2</td>
            <td> 2행 2열</td>
            <td> 2행 3열</td>
        </tr>
        <tr>
            <td> 제목 3</td>
            <td> 3행 2열</td>
            <td> 3행 3열</td>
        </tr>                        
</body>
</html>
