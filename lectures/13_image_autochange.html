<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="button" value="네이버로 가기" onclick="move(1)">&nbsp; <!--&nbsp 공백-->
    <input type="button" value="새로고침" onclick="move(2)">&nbsp;
    <input type="button" value="구글로 가기" onclick="move(3)">&nbsp;
    <script>
        // BOM(window) / DOM
        Back = new Array("images/la.jpg","images/ny.jpg","images/chicago.jpg")
        console.log(location.href);
        console.log(location.port);
        console.log(location.host);
        // 수학함수, Math는 정적함수들만 모여있는 클래스 
        // 0 ~ 1 사이의 값으 리턴 0,1,2
        // 0.7221313123 * 3 => 1.2.....
        index = Math.floor(Math.random()*3); // 내림(0,1,2)
        document.write("<body background=" + Back[index] + ">"); // 브라우저
        document.write("<b style='color: yellow;'>접속할 때마다 랜덤으로 이미지 출력......!</b>");
        document.write("<b style='color: red;'>웹 브라우저에서 새로고침 해보세요</b>");
        function move(a){
            switch(a){
                case 1 : location.href = "http://www.naver.com"; break;
                case 2 : location.reload(); break;
                case 3 : location.replace("http://www.google.com"); break;
            }
        }
    </script>
</body>
</html>
