<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .bluetext{ /* class 이름 사용 : 임의로 정한 이름*/
            font-size: 50px;
            color: orange;
        }
        #usda{ /* id에 적용 : element에 있는 */
            font-size: 30px;
            color: green;
        }
        table, th, td{ /* tag 이름에 적용 */
            border: 3px solid purple; /* #으로 시작하고 3바이트로 표현하는 컬러값 2자리당 1바이트 */
        }
        table{
            border-collapse: collapse;
        }
    </style>
</head>
<body>

    <table border="1">
        <!-- <colgroup> 
            <col>
            <col span="1" style="background-color: purple;">
            <col style="background-color: purple;">
        </colgroup> -->
        <tr>     
            <th rowspan="2"> 구분 </th> 
            <th colspan="3"> 우도입도 총괄 입금표 </th>
        </tr>
        <tr>
            <td> 선박요금 </td>
            <td> 도립공원입장료 </td>
            <td> 터미널이용료 </td>

        </tr>
        <tr>
            <td> 성인 </td>
            <td> 2000원 </td>
            <td> 1000원 </td>
            <td> 500원 </td>
        </tr>
    </table> 

    <table class="mb-5"> ... </table>  

    <table border="2" width="400" bordercolor="#9900ff" cellspacing="0">
        <tr align="center">
            <td rowspan="2"> 구분 </td> <td colspan="3"> 우도입도 총괄 요금표 </td>
        </tr>
        <tr align="center">
            <td> 선박요금 </td> <td> 도립공원입장료 </td><td> 터미널이용료 </td>
        </tr>
        <tr align="center" valign="center">
            <td> 성인 </td> <td> 2000원 </td><td> 1000원 </td><td> 500원 </td>
        </tr>
    </table>
</body>
</html>
